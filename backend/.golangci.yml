# golangci-lint konfiguratsiyasi — v2 formati.
#
# ⚠️ VERSIYA BILAN BOG'LIQ: bu fayl v2 sxemasida yozilgan va CI'da versiya
# ANIQ PIN qilingan (`.github/workflows/ci.yml`). Avval CI `version: latest`
# ishlatardi, konfiguratsiya esa v1 formatida edi — ya'ni golangci-lint v2
# chiqishi bilan lint bosqichi "can't load config" bilan yiqilardi. Bu
# vaqt bombasi edi: kod o'zgarmasa ham CI bir kuni qizil bo'lardi.
#
# v1 → v2 da o'zgargan asosiy narsalar (shu fayl uchun):
#   · `version: "2"` majburiy;
#   · `gosimple` `staticcheck` ichiga qo'shildi — alohida linter sifatida yo'q;
#   · formatlovchilar (`gofmt`, `goimports`) `linters` dan `formatters` ga ko'chdi;
#   · `linters-settings` → `linters.settings`;
#   · `issues.exclude-rules` → `linters.exclusions.rules`.
version: "2"

run:
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck # `gosimple` ni ham o'z ichiga oladi (v2)
    - unused
    - misspell
    - bodyclose
    - noctx
    - sqlclosecheck

  settings:
    misspell:
      locale: US

  exclusions:
    rules:
      # Testlarda qaytish qiymatini e'tiborsiz qoldirish odatiy (masalan
      # `defer res.Body.Close()`), bu yerda errcheck shovqin beradi.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/zoom/darsly
