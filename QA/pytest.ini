[pytest]
testpaths = backend frontend mobile e2e
python_files = test_*.py
python_functions = test_*
addopts = -ra
markers =
    smoke: yengil va XAVFSIZ testlar — prod-monitor profilida ham ishlaydi (o'qish yoki o'z-ustidan tozalanadigan)
    destructive: ma'lumot o'zgartiradi/o'chiradi — FAQAT local/ephemeral profilida
    mentor: mentor roli kerak (DB promote yoki seed admin)
    ws: WebSocket testi
    slow: sekin (E2E/polling)
