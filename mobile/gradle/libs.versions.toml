# Darsly Mentor — bog'liqlik katalogi (version catalog)
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
# KSP versiyasi Kotlin versiyasiga QAT'IY bog'langan (2.0.21-1.0.28).
ksp = "2.0.21-1.0.28"
composeBom = "2024.10.01"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigationCompose = "2.8.4"
retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.1"
# io.livekit:livekit-android — 2026-07 holatiga eng oxirgi barqaror versiya
livekit = "2.27.0"
# androidx.security:security-crypto — 1.1.0 BARQAROR (2025-07-30, Tink 1.8.0).
# Avval 1.1.0-alpha06 (2023-04) edi: 3 yillik pre-release. Batafsil: mobile/README.md §9.
securityCrypto = "1.1.0"
# io.sentry:sentry-android — crash-hisobotlari (M15).
# NDK qo'llab-quvvatlashi shu artefaktga KIRADI: bizdagi ma'lum yiqilish
# (`libjingle_peerconnection_so.so` · SIGABRT) NATIV qatlamda va uni faqat
# NDK handler tutadi — sof Java/Kotlin handler u yerda hech nima ko'rmaydi.
sentry = "7.18.0"
# Hilt (Dagger) — bog'liqlik injeksiyasi.
#
# NEGA KERAK: avval `Net`, `Session`, `Realtime`, `NotificationsBadge` global
# `object` singleton'lar edi. Oqibati — ViewModel'larni test qilib bo'lmasdi
# (bog'liqlikni almashtirishning yo'li yo'q) va 37 test faylida BITTA ham
# ViewModel testi yo'q edi. Hilt shu eshikni ochadi.
#
# Versiya Kotlin 2.0.21 + KSP bilan mos (2.52+ KSP'ni to'liq qo'llab-quvvatlaydi).
hilt = "2.52"
# androidx.hilt — Compose navigatsiyasida `hiltViewModel()` uchun.
hiltNavigationCompose = "1.2.0"
datastore = "1.1.1"
junit = "4.13.2"
coroutines = "1.8.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentry" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
moshi-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

livekit-android = { group = "io.livekit", name = "livekit-android", version.ref = "livekit" }

# ── Testlar (JVM unit) ────────────────────────────────────────────────────────
junit = { group = "junit", name = "junit", version.ref = "junit" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
