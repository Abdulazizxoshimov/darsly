org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ── Java toolchain ──────────────────────────────────────────────────────────
# Gradle'ning avtomatik JDK qidiruvi O'CHIRILGAN.
#
# Sabab: u tizimdagi har qanday JVM'ni nomzod deb oladi, jumladan `javac`siz
# JRE'ni ham. Hilt annotatsiya protsessori uchun alohida javac taski yaratadi
# (`hiltJavaCompileDebug`) va u shunday JRE'ga tushsa build
# `does not provide the required capabilities: [JAVA_COMPILER]` bilan yiqiladi —
# kod to'g'ri bo'lsa ham.
#
# O'chirilganda Gradle `~/.gradle/jdks` dagi (foojay-resolver yuklab bergan)
# to'liq JDK'ni va `JAVA_HOME` ni ishlatadi — CI'da `setup-java` bergani ham
# shu yo'l bilan topiladi.
org.gradle.java.installations.auto-detect=false
