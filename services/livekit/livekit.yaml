# LiveKit SFU server konfiguratsiyasi.
# Dev uchun default qiymatlar; PRODUCTION uchun pastdagi izohlarга rioya qiling.
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  # UDP media diapazoni kengaytirildi (guruh darsida ko'p track uchun).
  # docker-compose.yml portlari shu diapazonga mos bo'lishi shart.
  port_range_start: 50000
  port_range_end: 60000
  # DEV: false (localhost). PRODUCTION: true qiling yoki node_ip ga ochiq IP bering,
  # aks holda internetdagi klientlar media portlariga umuman yeta olmaydi.
  use_external_ip: false
  # node_ip: "SERVERNING_OCHIQ_IP"   # production'da use_external_ip o'rniga

# ── TURN relay — YOMON INTERNET / SIMMETRIK NAT / KORPORATIV FIREWALL uchun KRITIK ──
# Bularsiz cheklovchi tarmoq ortidagi foydalanuvchilarda media umuman ulanmaydi (ICE fail).
# DEV: 3478/udp yetarli. PRODUCTION: TLS TURN (443/tcp) — mobil/korporativ proksilar
# faqat 443'ni o'tkazadi; domen + sertifikat kerak.
#
# IZCHILLIK: test/staging serveri ham AYNI xatti-harakatda bo'lishi shart —
# `deploy/server/livekit.yaml.example` da ham `turn.enabled: true` + `udp_port: 3478`
# (u yerda qo'shimcha `domain: livekit.<IP>.sslip.io`, chunki mobil klientga real
# DNS nomli TURN URI kerak). Dev'da `domain` yo'q → LiveKit node IP'ni (localhost)
# e'lon qiladi, bu local test uchun yetarli.
turn:
  enabled: true
  udp_port: 3478
  # PRODUCTION uchun (443 ustidan TURNS):
  # tls_port: 5349
  # domain: turn.darsly.uz
  # external_tls: true          # TLS'ni reverse-proxy/LB tugatsa

# ── KECHIKISH: jitter-buferni cheklash (o'lchov bilan) ───────────────────────
# LiveKit `playout-delay` RTP kengaytmasini yuboradi; Chrome uni hurmat qiladi va
# jitter-buferini shu chegaralar ichida ushlaydi. Busiz Chrome buferni O'ZI
# tanlaydi va ekran-ulashishda (past fps, katta kadrlar) uni juda kattalashtiradi.
#
# `frontend/tools/media-probe` bilan o'lchandi (lokal, bir xil sozlama, faqat shu
# blok qo'shildi) — "shishadan-shishagacha" kechikish, p50/p95:
#
#   qatlam        | oldin           | keyin           | jitter-bufer
#   yuqori 1080p  | 154 / 180 ms    |  85 / 127 ms    | 72 ms → 6 ms
#   o'rta  1080p  |  68 / 104 ms    |  63 / 158 ms    |  5 ms → 6 ms
#   past   1080p  | 288 / 1118 ms   | 171 / 267 ms    | 113 ms → 103 ms
#
# Sifat (PSNR va matn keskinligi) O'ZGARMADI — ya'ni bu sof yutuq.
# `max: 500` ATAYLAB 250 emas: yaxshi tarmoqda natija bir xil (o'lchandi), lekin
# yomon tarmoqda buferga joy qoladi va `min: 0` sabab uzilib qolmaydi.
room:
  playout_delay:
    enabled: true
    min: 0
    max: 500

# API kalitlar — backend token generatsiyasi (.env: LIVEKIT_API_KEY/SECRET) bilan mos bo'lsin.
keys:
  devkey: secret_at_least_32_characters_long_000000

# Egress (yozib olish) uchun Redis. 'recording' profili bilan ishga tushiriladi.
redis:
  address: redis:6379

# Egress tugagach LiveKit shu URL'ga webhook yuboradi → backend yozuvni 'ready'
# holatiga o'tkazadi. Bu blok bo'lmasa recording'lar abadiy 'processing'da qoladi.
# host.docker.internal — LiveKit konteyneridan xost mashinadagi backend (8087) ga.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8087/api/v1/webhooks/livekit

logging:
  level: info
