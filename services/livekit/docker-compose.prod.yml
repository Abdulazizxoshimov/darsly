# LiveKit — PRODUCTION deployment (yomon internet / NAT / korporativ firewall uchun).
#
# A1.4 — Bu stack butun platformaning YAGONA edge reverse-proxy'sini (Caddy, 80/443)
# saqlaydi. Caddy TLS'ni (Let's Encrypt) app./api./files./livekit.darsly.uz uchun
# avtomatik tugatadi va SPA'ni (darsly_frontend_dist volume) beradi. Backend stackda
# nginx YO'Q — ikkita raqib 80/443 proxy muammosi shu bilan hal qilingan.
#
# Oldindan (bir marta, backend stack bilan umumiy):
#   docker network create darsly_net
#   docker volume  create darsly_frontend_dist
#
# Ishga tushirish:
#   cp .env.prod.example .env.prod   # LIVEKIT_API_KEY/SECRET, DOMAIN'larni to'ldiring
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   # yozib olish (Egress) bilan:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile recording up -d
#
# TURNS (443/tcp → livekit 5349): Caddy HTTP layer'i xom TLS/TCP'ni uzata olmaydi —
# alohida L4 LB kerak (B2.1). Hozir livekit 5349'ni to'g'ridan-to'g'ri ochamiz;
# UDP TURN 3478 yomon-internet uchun ishlaydi.

services:
  redis:
    image: redis:7-alpine
    container_name: darsly-livekit-redis
    restart: unless-stopped
    volumes:
      - livekit_redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: darsly-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    depends_on:
      - redis
    environment:
      # MUHIM: LiveKit config fayl ${ENV} ni kengaytirmaydi. Kalitlar shu MAXSUS
      # env orqali beriladi (compose ${LIVEKIT_API_SECRET} ni interpolatsiya qiladi).
      # Format "<api_key>: <api_secret>"; api_key ommaviy identifikator (livekit.prod.yaml
      # webhook.api_key va backend LIVEKIT_API_KEY bilan mos — default "darsly").
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"                    # signal / API — Caddy ortida wss
      - "7881:7881"                    # RTC over TCP (UDP bloklangan tarmoq uchun)
      - "3478:3478/udp"                # TURN relay (UDP tez yo'l)
      - "5349:5349"                    # TURNS (TLS) — LB 443→5349 yo'naltiradi
      - "50000-60000:50000-60000/udp"  # RTC media (UDP diapazon)
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    networks:
      - default       # redis, egress (stack ichi)
      - darsly_net    # Caddy → livekit:7880 (edge)

  caddy:
    image: caddy:2-alpine
    container_name: darsly-caddy
    restart: unless-stopped
    depends_on:
      - livekit
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/www:ro      # A1.2 — SPA statik (backend stack build qiladi)
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default       # livekit (stack ichi)
      - darsly_net    # Caddy → app:8080, minio:9000 (backend stack)

  egress:
    image: livekit/egress:latest
    container_name: darsly-egress
    restart: unless-stopped
    profiles: ["recording"]
    depends_on:
      - redis
      - livekit
    environment:
      # A1.3 — egress config faylда ${ENV} kengaymaydi. Butun konfiguratsiyani
      # EGRESS_CONFIG_BODY orqali beramiz; compose ${LIVEKIT_API_SECRET} ni SHU YERДА
      # interpolatsiya qiladi → egress HAQIQIY kalitni oladi (dev devkey EMAS).
      # api_key ("darsly") livekit LIVEKIT_KEYS bilan mos.
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        log_level: info
    cap_add:
      - SYS_ADMIN
    networks:
      - default       # redis, livekit (stack ichi)
      - darsly_net    # egress → minio:9000 (S3 yozuv, backend stack)

networks:
  default:
  # A1.4 — backend stack bilan umumiy edge tarmog'i (oldindan yaratilgan).
  darsly_net:
    external: true

volumes:
  livekit_redis_data:
  caddy_data:
  caddy_config:
  # A1.2 — backend stackdagi frontend-builder to'ldiradi (umumiy external volume).
  frontend_dist:
    external: true
    name: darsly_frontend_dist
