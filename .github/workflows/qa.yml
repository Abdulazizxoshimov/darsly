name: QA (black-box)

# Python QA batareyasi — jonli, ishlab turgan backendga qarshi (black-box).
# Mavjud `ci.yml` (oq-quti: Go/vitest/JVM) TEGILMAYDI — bu ALOHIDA qatlam:
# CI runnerda infra (docker-compose.dev.yml) ko'tariladi, backend `go run` bilan
# ishga tushadi, so'ng QA/ Python suite'i real HTTP/WS orqali tekshiradi.
# LiveKit SFU CI'da yo'q → room-token testlari `requires_livekit` bilan TOZA skip.

on:
  push:
  pull_request:
  # Kunlik to'liq regressiya (tashqi bog'liqliklar — Docker image, go/pip modul —
  # o'zgarsa ertalab ko'ramiz, deploy paytida emas). ci.yml bilan bir vaqt.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  # ─── Ephemeral backend + Python QA ───────────────────────────────────────────
  qa-ephemeral:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: QA/requirements.txt

      # Infra (postgres 5442 / redis 6399 / minio 9020 / rabbitmq 5682) — dev compose.
      # Backend .env.example aynan shu portlarga sozlangan (xostda `go run`).
      - name: Infra ko'tarish
        working-directory: backend
        run: |
          docker compose -f docker-compose.dev.yml up -d
          echo "postgres tayyor bo'lguncha kutamiz..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.dev.yml exec -T postgres pg_isready -U postgres && break
            sleep 2
          done

      - name: Python bog'liqliklari
        working-directory: QA
        run: pip install -r requirements.txt

      # Backend + QA — BITTA stepда: `go run` fon jarayoni step tugaguncha tirik
      # qoladi, shuning uchun pytest shu yerda ishga tushadi.
      - name: Backend ishga tushirish + QA suite
        working-directory: backend
        run: |
          set -e
          # .env dev qiymatlari (portlar 5442/6399/9020/5682). Test foydalanuvchilari
          # admin API orqali yaratiladi → seed admin SHART; sed bilan ANIQ o'rnatamiz
          # (config loader precedence'iga tayanmaymiz).
          cp .env.example .env
          sed -i 's|^SEED_ADMIN_EMAIL=.*|SEED_ADMIN_EMAIL=admin@darsly.uz|' .env
          sed -i 's|^SEED_ADMIN_PASSWORD=.*|SEED_ADMIN_PASSWORD=Admin12345|' .env
          sed -i 's|^ALLOW_OPEN_REGISTRATION=.*|ALLOW_OPEN_REGISTRATION=false|' .env
          echo "backend ishga tushmoqda (migratsiyalar + serve)..."
          go run ./cmd > /tmp/backend.log 2>&1 &
          echo "health 200 bo'lguncha kutamiz..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8087/health; then
              echo "backend TAYYOR ($i)"; break
            fi
            sleep 2
          done
          if ! curl -sf -o /dev/null http://localhost:8087/health; then
            echo "❌ backend ishga tushmadi — log:"; tail -50 /tmp/backend.log; exit 1
          fi
          cd ../QA
          QA_BASE_URL=http://localhost:8087 QA_PROFILE=ephemeral \
            python -m pytest -q --html=report.html --self-contained-html

      - name: Backend log (yiqilganda)
        if: failure()
        run: tail -100 /tmp/backend.log || true

      - name: QA hisobot (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: QA/report.html
          retention-days: 7

      # Telegram alert — FAQAT yiqilganда va sir o'rnatilgan bo'lsa (aks holda jim o'tadi).
      # Sirlar: Settings → Secrets → QA_TG_BOT_TOKEN, QA_TG_CHAT_ID.
      - name: Telegram alert (yiqilganda)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.QA_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.QA_TG_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram siri o'rnatilmagan — alert o'tkazib yuborildi (CI natijasi o'zgarmaydi)."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="❌ Darsly QA yiqildi — branch: ${{ github.ref_name }} · commit: ${{ github.sha }} — ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=${MSG}" >/dev/null || true

  # ─── Prod-monitor (synthetic monitoring) — DEPLOY BO'LGACH YOQILADI ───────────
  # Yangi serverda hali Docker/deploy YO'Q (CLAUDE.md «Server»). Jonli URL paydo
  # bo'lgach quyidagi jobни izohdan chiqaring va sirlarni qo'shing:
  #   QA_MONITOR_EMAIL / QA_MONITOR_PASSWORD (prod'dagi maxsus QA hisob).
