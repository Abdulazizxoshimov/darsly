  #       env:
  #         QA_BASE_URL: https://app.169.58.104.245.sslip.io   # deploy bo'lgach yangilang
  #         QA_PROFILE: prod-monitor                            # destruktiv testlar avto-skip
  #         QA_MONITOR_EMAIL: ${{ secrets.QA_MONITOR_EMAIL }}
  #         QA_MONITOR_PASSWORD: ${{ secrets.QA_MONITOR_PASSWORD }}
