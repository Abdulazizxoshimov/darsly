name: CI

on:
  # Har branch push'da (feature-branch'lar ham) — PR merge'dan OLDIN testlar ishlashi uchun.
  # Sabab: bu repoda GitHub `pull_request` triggerini ishga tushirmaydi (tarixda 0 run);
  # push esa ishonchli ishlaydi. Push'dagi checklar commit SHA'ga tushadi va branch
  # protection (required checks) shu bilan qanoatlanadi.
  push:
  pull_request:
  # Jadval bo'yicha to'liq regressiya (QA batareyasi) — har kuni 02:00 UTC (~07:00 Toshkent).
  # Kod o'zgarmasa ham tashqi bog'liqliklar (Docker image'lar, npm/go modul yangilanishlari)
  # sabab CI YIQILISHINI ertalab ko'ramiz — deploy paytida emas.
  schedule:
    - cron: "0 2 * * *"
  # Actions sahifasidan qo'lda ("Run workflow") ishga tushirish uchun.
  workflow_dispatch: {}

jobs:
  # ─── Backend (Go module: backend/) — build + vet + lint + test ───────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darsly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_REDIS_ADDR: localhost:6379
      # ⚠️ F-1 TUZATISHI. Bu ikki qator bo'lmasa CI 50+ integratsiya testini
      # JIMGINA o'tkazib yuboradi va paket baribir `ok` bo'lib ko'rinadi:
      #   · TEST_DB_PORT — `testutil` default'i 5442 (dev compose), CI'da esa 5432;
      #     mos kelmasa ulanish yiqiladi va testlar `t.Skip` qiladi.
      #   · TEST_REQUIRE_INFRA — skip'ni TAQIQLAYDI. Endi porti yana adashsa CI
      #     qizil bo'ladi, "yashil, lekin hech nima sinalmagan" holat qaytmaydi.
      TEST_DB_PORT: "5432"
      TEST_REQUIRE_INFRA: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Versiya ANIQ pin qilingan. `latest` bilan konfiguratsiya formati
      # major yangilanishda mos kelmay qolardi va lint bosqichi kod
      # o'zgarmasa ham bir kuni yiqilardi (`.golangci.yml` izohiga qara).
      #
      # ⚠️ VAQTINCHA BLOKLAMAYDI (continue-on-error). Sabab: go.mod `go 1.26` juda
      # yangi va HECH BIR golangci-lint hali go1.26 bilan QURILMAGAN (v2.5.0 ham
      # go1.25) → lint ishga tushganda go1.26 stdlib'ni parse qilolmay panic/exit 3
      # beradi (kod muammosi EMAS, toolchain bo'shlig'i). Build+Vet+Test baribir
      # gate qiladi. golangci-lint go1.26 build chiqargach continue-on-error olib
      # tashlanadi (va kerak bo'lsa versiya pin yangilanadi).
      - name: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: backend
          args: --timeout=5m

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # ─── Frontend — birlik testlari + build ─────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Frontend'da lint UMUMAN yo'q edi: ishlatilmagan o'zgaruvchi, yetishmayotgan
      # hook bog'liqligi (eng ko'p uchraydigan React xatosi manbai) va o'lik kod
      # hech kim tomonidan tutilmasdi.
      - name: Lint
        run: npm run lint

      # Birlik + komponent testlari (vitest). Avval CI faqat build qilardi —
      # ya'ni xona mantig'idagi regressiya CI'dan bemalol o'tib ketardi.
      - name: Unit + komponent testlari
        run: npm test

      - name: Build
        run: npm run build

  # ─── E2E (Playwright + MSW mock) ────────────────────────────────────────────
  # Alohida job: brauzer yuklab olish sekin va build/testlarni bloklamasligi kerak.
  # Backend TALAB QILINMAYDI — smoke MSW mock ustida ishlaydi (deterministik).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Playwright brauzeri
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Hisobot (yiqilganda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─── Mobil (Android) — birlik testlari + lint ───────────────────────────────
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Media/tarmoq qarorlari (MediaTuning, ScreenAudioPolicy, HandQueue,
      # LessonReconnectPolicy) sof sinflarga ajratilgan va aynan shu testlar
      # ularni qotiradi — ular CI'da ishlashi shart.
      - name: Birlik testlari
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
