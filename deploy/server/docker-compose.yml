# Darsly — server test/staging stack (Contabo VPS, ko'p-qurilma sinov uchun).
#
# Yagona origin: app.<IP>.sslip.io (SPA + /api + /ws), livekit.<IP>.sslip.io (signaling).
# Caddy avtomatik Let's Encrypt HTTPS beradi (kamera uchun majburiy).
# LiveKit host-network'da (media UDP to'g'ridan-to'g'ri public IP'ga).
#
# Ishga tushirish: deploy/server/remote-setup.sh (secret + .env + livekit.yaml yasaydi),
# so'ng: docker compose -f docker-compose.yml up -d --build
#
# tgbot (systemd) va eduverse'ga TEGMAYDI — alohida darsly_ prefiks, alohida tarmoq.

name: darsly

networks:
  darsly_net:
    driver: bridge

volumes:
  darsly_pg:
  darsly_redis:
  darsly_minio:
  darsly_caddy_data:
  darsly_caddy_config:
  darsly_prometheus:
  darsly_grafana:
  darsly_loki:
  # Telegram Local Bot API Server fayllari. Backend bilan ULASHILADI: yozuvni
  # arxivdan tiklashda fayl HTTP orqali qayta yuklanmasdan, to'g'ridan-to'g'ri
  # shu volume'dan o'qiladi (1 GB video uchun daqiqalar farqi).
  darsly_tgapi:

services:
  postgres:
    image: postgres:16-alpine
    container_name: darsly-postgres
    restart: unless-stopped
    # Tuning (DB audit M7): default 128MB shared_buffers 4-core/7GB hostda kam;
    # lock_timeout — navbatga tushgan ALTER butun trafikni bloklamasin;
    # idle_in_transaction_session_timeout — tashlab ketilgan tranzaksiya
    # (kelajakdagi WithTx chaqiruvchisi) qulflarni ushlab qolmasin.
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - lock_timeout=5000
      - -c
      - idle_in_transaction_session_timeout=30000
    environment:
      POSTGRES_USER: darsly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: darsly
    volumes:
      - darsly_pg:/var/lib/postgresql/data
    networks: [darsly_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darsly -d darsly"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: darsly-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - darsly_redis:/data
    networks: [darsly_net]
    # FAQAT loopback'ga publish (public internetga OCHILMAYDI). Sababi: LiveKit
    # host-network'da ishlaydi va darsly_net'dagi 'redis' nomini resolve qila olmaydi,
    # lekin egress recording uchun LiveKit bilan AYNI Redis kerak → 127.0.0.1:6399.
    # 6399 — darsly'ning dev konvensiyasi (CLAUDE.md port jadvali), tgbot/eduverse
    # standart 6379 bilan to'qnashmasin.
    ports:
      - "127.0.0.1:6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Ceiling generous va maxmemory-policy ATAYLAB o'zgartirilmaydi: Redis
    # sessiya/JTI/ban'ni tutadi — eviction ularni o'chirib foydalanuvchilarni
    # tizimdan chiqarardi. Redis yuki kichik, limit faqat runaway'ga qarshi.
    deploy:
      resources:
        limits:
          memory: 768M

  minio:
    image: minio/minio:latest
    container_name: darsly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - darsly_minio:/data
    networks: [darsly_net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    # Serverda ghcr'dan TAYYOR image tortiladi (CI quradi — `.github/workflows/deploy.yml`):
    #   docker compose pull backend && docker compose up -d   (BACKEND_TAG=commit-sha)
    # `build:` lokal dev uchun QOLADI: `docker compose up --build` hali ham quradi.
    # BACKEND_TAG .env yoki shell'dan keladi; yo'q bo'lsa `latest`.
    image: ghcr.io/abdulazizxoshimov/darsly-backend:${BACKEND_TAG:-latest}
    build:
      context: ../../backend
      dockerfile: deployments/Dockerfile
    container_name: darsly-backend
    restart: unless-stopped
    env_file: [.env]
    # APP_ROLE'ni env orqali boshqarish (audit R5): default "all" (bitta jarayon).
    # Yukni ajratish uchun .env ga BACKEND_ROLE=api qo'ying va `--profile worker`
    # bilan `backend-worker` konteynerini yoqing — shunda ffmpeg/Telegram-upload
    # yuki API konteyneridan chiqadi (bitta hostda ham cgroup izolyatsiyasi).
    environment:
      APP_ROLE: ${BACKEND_ROLE:-all}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [darsly_net]
    expose: ["8080"]
    volumes:
      # Telegram arxivi: tiklashda fayllar shu yerdan O'QILADI (faqat o'qish).
      # Telegram o'chiq bo'lsa volume bo'sh turadi — hech narsaga xalaqit qilmaydi.
      - darsly_tgapi:/var/lib/telegram-bot-api:ro
    # Backend YAGONA healthcheck'siz servis edi: konteyner "up" ko'rinardi,
    # lekin ichida migratsiya yiqilgan yoki DB'ga ulanmagan bo'lishi mumkin edi.
    # `/ready` aynan bog'liqliklarni (PG/Redis) tekshiradi, `/health` esa faqat
    # jarayon tirikligini — shuning uchun bu yerda `/ready`.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Resurs cheklovi (audit R1): backend runaway (masalan transcode ffmpeg,
    # katta upload) SFU/PG'ni och qoldirmasin. Transcode allaqachon nice=19 +
    # 2 thread bilan ichida cheklangan, bu esa qattiq ceiling.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 256M

  # ── Worker jarayoni (APP_ROLE=worker) — IXTIYORIY, `--profile worker` ────────
  #
  # Fon ishchilarini (ffmpeg transkod, Telegram upload, reminder, auto-end,
  # retention) API konteyneridan AJRATADI (system-design audit R5). Bitta hostda
  # ham foydali: og'ir ffmpeg/Chrome-adjacent yuk alohida cgroup'da bo'ladi va
  # API so'rovlariga sekinlik bermaydi.
  #
  # Yoqish:
  #   1) .env ga qo'shing:  BACKEND_ROLE=api   (backend endi FAQAT HTTP)
  #   2) docker compose --profile worker up -d
  # Aks holda (default) backend "all" bo'lib ishchilarni ham o'zi yuritadi —
  # bu holda worker konteynerini YOQMANG (aks holda ishchilar ikki marta ketadi;
  # ular claim-based, ya'ni dublikat xavfsiz, lekin ffmpeg 2× bekorga yuklanadi).
  backend-worker:
    image: ghcr.io/abdulazizxoshimov/darsly-backend:${BACKEND_TAG:-latest}
    build:
      context: ../../backend
      dockerfile: deployments/Dockerfile
    container_name: darsly-backend-worker
    restart: unless-stopped
    profiles: ["worker"]
    env_file: [.env]
    environment:
      APP_ROLE: worker
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [darsly_net]
    volumes:
      - darsly_tgapi:/var/lib/telegram-bot-api:ro
    # ffmpeg transkod shu yerda ishlaydi — CPU ceiling API'ni himoya qiladi.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M

  caddy:
    image: caddy:2-alpine
    container_name: darsly-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro          # Vite build (deploy/server/www) — to'g'ridan-to'g'ri
      - ./dl:/srv-dl:ro        # yuklab olish uchun statik fayllar (mobil APK, QR bilan)
      - darsly_caddy_data:/data
      - darsly_caddy_config:/config
    networks: [darsly_net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [backend]

  livekit:
    image: livekit/livekit-server:latest
    container_name: darsly-livekit
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # livekit.yaml da `redis:` bloki yoqilgan bo'lsa (ENABLE_RECORDING=1) LiveKit
    # Redis'siz ISHGA TUSHMAYDI → Redis sog'lom bo'lgandan keyin startlaydi.
    # (network_mode: host bilan depends_on muammosiz ishlaydi — u tarmoqqa bog'liq emas.)
    depends_on:
      redis: {condition: service_healthy}

  # ── Egress (dars yozib olish → MinIO) — DOIM ISHLAYDI ───────────────────────
  #
  # Avval `profiles: ["recording"]` ortida edi va shu sababli serverda hech
  # qachon ishga tushmagan — ya'ni yozib olish **umuman ishlamagan**, lekin
  # UI'da "Yozib olishni boshlash" tugmasi turgan. Mahsulot qoidasi o'zgardi:
  # yozib olish **default yoniq** va backend uni `room.HostToken` da avtomatik
  # boshlaydi, shuning uchun egress ixtiyoriy profil emas — u stack'ning
  # doimiy qismi.
  #
  # Og'ir konteyner (Chrome headless). Shartlar:
  #   1) livekit.yaml da `redis:` bloki YOQILGAN bo'lishi shart (ENABLE_RECORDING=1
  #      ./remote-setup.sh) — egress ↔ LiveKit AYNI Redis orqali gaplashadi.
  #   2) LiveKit signaling'ga darsly_net'dan chiqish: host.docker.internal:7880
  #      (ufw da 172.16.0.0/12 → 7880/tcp allaqachon ochilgan — remote-setup.sh).
  #   3) S3 (MinIO) manzili backend'dan StartRoomRecording so'rovida keladi
  #      (http://minio:9000) — egress darsly_net'da bo'lgani uchun resolve qiladi.
  # DIQQAT: LiveKit/egress config ${ENV} ni KENGAYTIRMAYDI — shu sabab config
  # EGRESS_CONFIG_BODY orqali beriladi (compose ${...} ni O'ZI interpolatsiya qiladi).
  egress:
    image: livekit/egress:latest
    container_name: darsly-egress
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    networks: [darsly_net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
          db: 0
        api_key: darslykey
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://host.docker.internal:7880
        log_level: info
    cap_add:
      - SYS_ADMIN
    # Chrome headless /dev/shm ni to'ldiradi → tab crash. 1G yetarli.
    shm_size: "1gb"
    # ⭐ RESURS LIMITI (system-design audit R1) — ENG MUHIMI.
    #
    # Egress = headless Chrome + ffmpeg, bir yozuv ~1-1.5 yadro. Bir NECHA
    # yozuv AYNI shu konteyner ichida ochiladi, shuning uchun bu ceiling
    # BARCHA bir vaqtli yozuvlarni birgalikda cheklaydi: 4 yadroli hostda
    # 2 yadrodan oshmasin — qolgan 2 yadro SFU (livekit) uchun kafolatlanadi,
    # aks holda yozuvli darslar SFU'ni och qoldirib BARCHA xonalarda jitter
    # keltirib chiqarardi. Backend'dagi EGRESS_MAX_CONCURRENT bilan birga
    # ishlaydi (u soni cheklaydi, bu CPU'ni).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M

  # ── Telegram Local Bot API Server (dars arxivi) ─────────────────────────────
  #
  # PROFIL ORTIDA: `--profile telegram` bo'lmasa ishga tushmaydi.
  #
  # Sabab: servis `api_id`/`api_hash` ni TALAB qiladi va ular hali yo'q
  # bo'lgan serverda butun stack'ni yiqitib qo'yardi. Telegram esa ixtiyoriy
  # integratsiya — usiz platforma to'liq ishlaydi (yozuvlar shunchaki
  # serverda qoladi).
  #
  # Yoqish:
  #   1) .env ga TELEGRAM_API_ID / TELEGRAM_API_HASH / TELEGRAM_BOT_TOKEN /
  #      TELEGRAM_ARCHIVE_CHAT_ID qo'shing (remote-setup.sh bo'sh qoldiradi);
  #   2) docker compose --profile telegram up -d
  #
  # ⚠️ TASHQARIGA PORT OCHILMAYDI. Bu server bot tokenini URL yo'lida qabul
  # qiladi (`/bot<token>/sendVideo`) — internetga chiqarilsa token har
  # so'rovda ochiq ketardi. Faqat darsly_net ichida, `telegram-bot-api:8081`.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: darsly-telegram-bot-api
    restart: unless-stopped
    profiles: ["telegram"]
    environment:
      # ⚠️ `:?` (majburiy) EMAS — `:-` (bo'sh default).
      #
      # Compose profil ichidagi servisning o'zgaruvchilarini ham interpolatsiya
      # qiladi, ya'ni `:?` bilan Telegram YOQILMAGAN deployda ham butun
      # `docker compose up` yiqilardi: "required variable TELEGRAM_API_ID is
      # missing a value" (2026-08-01 da serverda aynan shu bo'ldi va deploy
      # to'xtab qoldi). Qiymat yo'qligini servisning O'ZI tekshiradi.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      # --local: 2 GB chegara + `getFile` absolyut lokal yo'l qaytaradi.
      TELEGRAM_LOCAL: "true"
      TELEGRAM_STAT: "false"
    volumes:
      - darsly_tgapi:/var/lib/telegram-bot-api
    networks: [darsly_net]
    expose: ["8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Kuzatuv (M16) ───────────────────────────────────────────────────────────
  #
  # Auditgacha ishlayotgan serverda kuzatuv NOL edi: metrikalar kodda bor edi,
  # lekin ularni hech kim so'ramasdi va hech qanday ogohlantirish yo'q edi.
  # Incident paytida yagona manba — `docker logs` bo'lardi.
  #
  # Hammasi ICHKI tarmoqda: port tashqariga chiqarilmaydi. Kirish uchun SSH
  # tunnel ishlatiladi (`ssh -L 3030:localhost:3030 ...`), chunki Grafana'ni
  # internetga ochish yana bitta autentifikatsiya yuzasi degani.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: darsly-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 kun — VPS diski 145 GB va yozuvlar (MinIO) bilan bo'lishiladi.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Scrape tokeni — `remote-setup.sh` .env bilan birga yaratadi.
      - ./observability/metrics_token:/etc/prometheus/metrics_token:ro
      - darsly_prometheus:/prometheus
    networks: [darsly_net]
    depends_on: [backend]

  loki:
    image: grafana/loki:2.9.0
    container_name: darsly-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - darsly_loki:/loki
    networks: [darsly_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.0
    container_name: darsly-grafana
    restart: unless-stopped
    # FAQAT localhost'ga bog'lanadi — SSH tunnel orqali kiriladi.
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD kerak}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - darsly_grafana:/var/lib/grafana
    networks: [darsly_net]
    depends_on: [prometheus]

# =============================================================================
# FAZA C — SCALE SKELETI (system-design audit P2). Hozir YOQILMAGAN: bitta host.
# Ikkinchi host paydo bo'lganda quyidagilarni faollashtiring.
# =============================================================================
#
# ── Redis Sentinel (HA, audit R2) ───────────────────────────────────────────
# Redis compound SPOF: u o'chsa video + yangi login + ban holati yo'qoladi.
# Sentinel bilan master o'chsa replica avtomatik ko'tariladi.
# Yoqish:
#   1) redis'ni master, 2-hostda redis-replica, va 3 sentinel ishga tushiring;
#   2) .env: REDIS_SENTINEL_ADDRS=sentinel1:26379,sentinel2:26379,sentinel3:26379
#            REDIS_SENTINEL_MASTER=mymaster
#   (backend kodi allaqachon failover-klientni qo'llaydi — redis.New).
# Namuna (bir host, minimal — production'da sentinel'lar alohida hostlarda):
#
#   redis-replica:
#     image: redis:7-alpine
#     command: ["redis-server","--replicaof","redis","6379",
#               "--requirepass","${REDIS_PASSWORD}","--masterauth","${REDIS_PASSWORD}",
#               "--appendonly","yes"]
#     networks: [darsly_net]
#     depends_on: [redis]
#
#   sentinel:
#     image: redis:7-alpine
#     entrypoint: ["redis-sentinel","/etc/sentinel.conf"]
#     # sentinel.conf: "sentinel monitor mymaster redis 6379 2" + auth-pass
#     networks: [darsly_net]
#     depends_on: [redis]
#
# ── PgBouncer (3+ API nusxasi bo'lganda, audit R5/DEPLOYMENT §6.1) ────────────
# Ko'p API nusxasi × pgxpool = PG max_connections'ni bosib ketishi mumkin.
# PgBouncer transaction-pooling bilan ulanishlarni multipleks qiladi.
# Yoqish: backend DATABASE_URL/DB_HOST'ni pgbouncer'ga qarating (port 6432).
#
#   pgbouncer:
#     image: edoburu/pgbouncer:latest
#     environment:
#       DB_HOST: postgres
#       DB_USER: darsly
#       DB_PASSWORD: ${DB_PASSWORD}
#       DB_NAME: darsly
#       POOL_MODE: transaction
#       MAX_CLIENT_CONN: "500"
#       DEFAULT_POOL_SIZE: "20"
#     networks: [darsly_net]
#     depends_on: [postgres]
#
# ── Multi-node LiveKit (media scale, audit R1/scalability) ────────────────────
# LiveKit distributed rejim allaqachon Redis'ni ishlatadi (recording uchun
# livekit.yaml `redis:` bloki). Ko'p SFU tugun uchun: har hostda livekit-server,
# oldida NLB (yoki DNS), hammasi AYNI Redis'ga ulanadi. Egress'ni ALOHIDA
# hostga chiqarish birinchi qadam (u faqat Redis+MinIO+signaling talab qiladi).
